[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "foxtools"
version = "1.0.0"
description = "Meine eigene Python-Bibliothek"
authors = [
    { name = "FoxTools Developer" }
]
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["foxtools*"]